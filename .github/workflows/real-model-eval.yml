name: Real local model security evaluation (paired replay)

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Runs per dataset case (1-5, default 1)"
        required: false
        default: "1"
      model_size:
        description: "Which local Qwen2.5 instruct model to evaluate"
        required: false
        type: choice
        options: ["1.5b", "0.5b"]
        default: "1.5b"
  push:
    branches: [main]
    paths:
      - "scripts/real_model_eval.py"
      - "agentsec_lab/evaluate.py"
      - ".github/workflows/real-model-eval.yml"

permissions:
  contents: write

jobs:
  local-model-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.46.3 safetensors==0.4.5
      - name: Verify offline dataset and gate tests
        run: |
          python -m agentsec_lab validate --dataset data/cases.json
          python -m unittest discover -s tests -v
      - name: Evaluate selected Qwen2.5 model locally on CPU
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          PYTHONPATH: "."
          EVAL_REPETITIONS: ${{ github.event.inputs.repetitions || '1' }}
          EVAL_MODEL_SIZE: ${{ github.event.inputs.model_size || '1.5b' }}
        run: |
          python -m compileall -q scripts agentsec_lab
          python scripts/real_model_eval.py --model-size "$EVAL_MODEL_SIZE" --repetitions "$EVAL_REPETITIONS" --threads 4 --max-new-tokens 160
      - name: Upload complete research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2_5-paired-model-evaluation
          path: research/runs/qwen2.5-*-paired-160.*
          if-no-files-found: warn
          retention-days: 30
      - name: Commit generated exploratory results
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/runs/qwen2.5-*-paired-160.json research/runs/qwen2.5-*-paired-160.md
          if ! git diff --cached --quiet; then
            git commit -m "Record paired local model evaluation results"
            git push origin HEAD:main
          fi
