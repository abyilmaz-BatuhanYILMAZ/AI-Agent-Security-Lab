name: Matched-protocol Qwen2.5 0.5B comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/compare-qwen-0_5b.yml

permissions:
  contents: write

jobs:
  matched-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference dependencies on CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.46.3 safetensors==0.4.5
      - name: Run dataset validation and regression suite
        run: |
          python -m agentsec_lab validate --dataset data/cases.json
          python -m unittest discover -s tests -v
      - name: Run exact v2 paired-replay protocol against Qwen2.5 0.5B
        env:
          PYTHONPATH: "."
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: |
          python scripts/real_model_eval.py \
            --model-size 0.5b --repetitions 1 --max-new-tokens 160 \
            --threads 4 --output research/runs/qwen2.5-0.5b-paired-160.json
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2_5-0_5b-matched-v2
          path: research/runs/qwen2.5-0.5b-paired-160.*
          if-no-files-found: warn
          retention-days: 30
      - name: Commit reproducible model evidence
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/runs/qwen2.5-0.5b-paired-160.json research/runs/qwen2.5-0.5b-paired-160.md
          if ! git diff --cached --quiet; then
            git commit -m "Record matched-protocol Qwen2.5 0.5B evaluation"
            git push origin HEAD:main
          fi
