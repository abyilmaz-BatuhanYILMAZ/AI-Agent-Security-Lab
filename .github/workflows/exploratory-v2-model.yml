name: Exploratory v2 balanced-corpus real model evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/cases-exploratory-v2.json"
      - ".github/workflows/exploratory-v2-model.yml"

permissions:
  contents: write

jobs:
  expanded-model-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model and evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.46.3 safetensors==0.4.5
      - name: Validate original and exploratory datasets, historical evidence, and contracts
        run: |
          python -m unittest discover -s tests -v
          python -m agentsec_lab validate --dataset data/cases.json
          python -m agentsec_lab validate --dataset data/cases-exploratory-v2.json
          python scripts/audit_evidence.py --dataset data/cases.json --reports             research/runs/qwen2.5-0.5b-paired-160.json             research/runs/qwen2.5-1.5b-paired-160.json
      - name: Evaluate Qwen2.5 1.5B on separate balanced exploratory corpus
        env:
          PYTHONPATH: "."
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: |
          python scripts/real_model_eval.py             --dataset data/cases-exploratory-v2.json             --model-size 1.5b --max-new-tokens 160 --repetitions 1 --threads 4             --output research/runs/qwen2.5-1.5b-exploratory-v2.json
      - name: Preserve raw evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-1-5b-exploratory-v2
          path: research/runs/qwen2.5-1.5b-exploratory-v2.*
          if-no-files-found: warn
          retention-days: 30
      - name: Persist completed experiment evidence
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/runs/qwen2.5-1.5b-exploratory-v2.json research/runs/qwen2.5-1.5b-exploratory-v2.md
          if ! git diff --cached --quiet; then
            git commit -m "Record exploratory v2 balanced-corpus real-model evidence"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
